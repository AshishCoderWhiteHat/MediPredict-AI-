<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with rounded corners and subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#2A3850" stroke-width="2"/>

  <!-- Subtle Medical Cross watermark in the background -->
  <path d="M28 14h8v10h10v8H36v10h-8V32H18v-8h10V14z" fill="#2DD4BF" fill-opacity="0.12"/>

  <!-- Stylized Pulse / Stethoscope / AI Heartbeat line -->
  <path d="M12 33h10l4-9 7 20 6-15 4 7h9" 
        fill="none" 
        stroke="url(#tealGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- AI Intelligence Sparkle Node at the apex of the heartbeat -->
  <circle cx="33" cy="44" r="2.5" fill="#6EE7B7" />
  <circle cx="26" cy="24" r="2.5" fill="#2DD4BF" />
  <circle cx="43" cy="29" r="2.5" fill="#2DD4BF" />
</svg>
